import_full_history:
  name: Import full history
  description: >-
    Backfill the complete available meter history from the EAC portal into
    long-term statistics, for every meter on the account (active and retired).
    Includes precise 30-minute import/export profiles and sparse cumulative
    readings. Saves progress in weekly chunks and resumes after interruptions.
    Safe to re-run; corrected values replace earlier observations.
